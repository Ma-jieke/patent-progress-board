</style></head><body><div id="root"></div>
<script>
const routes={pre:{label:'预审',color:'#2475ef',stages:['撰写中','学校平台预审','预审通过后交专利公司撰写','撰写研发证明材料等相关材料','学校盖章','预审中','下证']},priority:{label:'优先审查',color:'#875fe8',stages:['撰写中','学校平台预审','预审通过后交专利公司撰写','撰写研发证明材料等相关材料','学校盖章','预审不通过转优审','下证']},utility:{label:'实用新型',color:'#19a381',stages:['撰写中','学校平台预审','预审通过后交专利公司撰写','审查中','下证']}};
const icons={layers:'<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5M3 17l9 5 9-5"/></svg>',arrow:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-7-7 7 7-7 7"/></svg>',clock:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 2"/></svg>',plus:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>',close:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',check:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg>'};
const days=n=>new Date(Date.now()-n*86400000).toISOString();
const seed=[];
const key='patentflow-standalone-preview';let patents=read(),filter='all',query='',dialog='',selected=null,editId=null;
function read(){return []}
function persist(){}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function stage(p){return routes[p.workflow].stages[p.stage]}
function done(p){return p.stage===routes[p.workflow].stages.length-1}
function time(s){let d=Math.floor((Date.now()-new Date(s).getTime())/86400000);return d<1?'今天更新':d===1?'昨天更新':d<30?d+' 天前更新':new Date(s).toLocaleDateString('zh-CN')}
function badge(p){return `<span class="workflow-badge ${p.workflow}"><span class="badge-dot"></span>${routes[p.workflow].label}</span>`}
function progress(p){return `<div class="progress-ticks">${routes[p.workflow].stages.map((_,i)=>`<span class="${i<p.stage?'done':i===p.stage?'current':''}" style="--bar-color:${routes[p.workflow].color}"></span>`).join('')}</div>`}
function render(){let total=patents.length,completed=patents.filter(done).length,shown=patents.filter(p=>(filter==='all'||p.workflow===filter)&&(p.title+p.owner+stage(p)+p.note).toLowerCase().includes(query.toLowerCase())).sort((a,b)=>b.updated_at.localeCompare(a.updated_at));let count=k=>patents.filter(p=>p.workflow===k).length;let recent=[...patents].sort((a,b)=>b.updated_at.localeCompare(a.updated_at)).slice(0,3);
 document.getElementById('root').innerHTML=`<div class="app-shell"><header class="site-header"><div class="header-inner"><a class="brand" href="#top"><div class="brand-mark">${icons.layers}</div><span>Patent<span class="brand-accent">Flow.</span></span><i></i></a><nav class="desktop-nav"><a href="#overview">数据总览</a><a href="#patents">专利列表</a><a href="#about">平台说明</a></nav><div class="header-actions"><span class="live-label"><span></span>本地预览</span><div class="admin-actions"><span class="admin-on">${icons.check} 演示管理</span><button class="btn-header" onclick="resetDemo()">重置演示</button></div></div></div></header>
<main id="top"><div class="hero-shell"><div class="container hero"><div class="hero-copy"><div class="eyebrow big"><span class="eyebrow-line"></span> RESEARCH · PATENT MANAGEMENT</div><h1>每一份创新，<br><span>都清晰可见。</span></h1><p>从撰写到下证，让课题组的每一项专利进展<br class="desktop-br">都有迹可循，一目了然。</p><a class="hero-link" href="#patents">查看专利进度 ${icons.arrow}</a></div><div class="hero-visual"><div class="visual-halo halo-one"></div><div class="visual-halo halo-two"></div><div class="glass-board"><div class="glass-header"><div class="glass-icon">${icons.layers}</div><span>申报进程</span><span class="tiny-flare">✦</span></div><div class="glass-stat">全流程掌握<span class="glass-spark">✦</span></div><div class="glass-sub">简单、清晰、持续更新</div><div class="glass-bars"><div><span style="width:83%"></span></div><div><span style="width:63%"></span></div><div><span style="width:93%"></span></div><div><span style="width:46%"></span></div></div><div class="glass-bottom"><div class="avatar-pair"><span>研</span><span>究</span><span>组</span></div><span>进展，一目了然 ↗</span></div></div><div class="floating-chip chip-top"><span class="chip-icon">${icons.check}</span>进度实时更新</div><div class="floating-chip chip-bottom"><span class="chip-blue-dot"></span>每一阶段，都可追踪</div></div></div></div>
<section id="overview" class="container overview"><div class="section-heading"><div><span class="section-kicker">OVERVIEW</span><h2>专利申报概览<span class="heading-period">.</span></h2><p>所有进展，尽在掌握。</p></div><div class="section-updated">${icons.clock} 本地示例数据</div></div><div class="demo-banner">✦ 当前为<b>离线演示</b>，下方专利均为示例，不代表课题组真实进度。你可以体验新增和修改；变更仅保存在这个浏览器。</div><div class="metrics-grid">${[['专利总数',total,'记录中的全部专利','primary-metric'],['正在推进',total-completed,'持续跟进中',''],['已下证',completed,'已完成全部阶段',''],['申报路线',3,'预审 · 优先审查 · 实用新型','']].map(([title,num,foot,cls])=>`<div class="metric ${cls}"><div class="metric-top"><span>${title}</span><div class="metric-icon">${icons.layers}</div></div><div class="metric-value">${String(num).padStart(2,'0')}</div><div class="metric-foot">${foot}</div></div>`).join('')}</div></section>
<section id="patents" class="container content-layout"><div class="main-column"><div class="section-heading list-heading"><div><span class="section-kicker">YOUR PATENTS</span><h2>专利进度<span class="heading-period">.</span></h2><p>查看每个专利当前所处的阶段。</p></div><button class="btn-primary add-button" onclick="openEdit()">${icons.plus} 新增专利</button></div><div class="toolbar"><div class="filter-tabs">${[['all','全部专利'],['pre','预审'],['priority','优先审查'],['utility','实用新型']].map(([id,label])=>`<button class="${filter===id?'active':''}" onclick="setFilter('${id}')">${label}${id==='all'?` <span>${total}</span>`:''}</button>`).join('')}</div><div class="search-wrap"><span>⌕</span><input id="search" placeholder="搜索专利名称、负责人…" value="${esc(query)}" oninput="setQuery(this.value)" /></div></div><div class="result-row"><span>共找到 <strong>${shown.length}</strong> 项专利</span><span>按最近更新排序</span></div><div class="patents-grid">${shown.map(p=>`<button class="patent-card" onclick="openDetail('${p.id}')"><div class="patent-card-top">${badge(p)}<span class="card-arrow">↗</span></div><h3>${esc(p.title)}</h3><div class="card-status-label">当前阶段 <span class="${done(p)?'complete-text':''}">${esc(stage(p))}</span></div>${progress(p)}<div class="card-progress-label">阶段 ${p.stage+1} / ${routes[p.workflow].stages.length}</div><div class="card-divider"></div><div class="card-bottom"><span class="card-owner"><span class="owner-avatar">${esc(p.owner.slice(0,1)||'未')}</span>${esc(p.owner||'未指定负责人')}</span><span class="card-date">${icons.clock}${time(p.updated_at)}</span></div></button>`).join('')||`<div class="empty-state"><div class="empty-icon">${icons.layers}</div><h3>没有找到匹配的专利</h3><p>试着切换流程或调整搜索关键词。</p></div>`}</div><div class="subtle-footer"><span>${icons.clock} 正式上线后每 30 秒自动同步</span><span>点击专利卡片查看完整流程 →</span></div></div><aside class="sidebar"><div class="side-panel"><div class="side-header"><div class="side-icon">${icons.layers}</div><div><h3>流程分布</h3><p>按申报路线统计</p></div></div><div class="distribution-list">${Object.entries(routes).map(([k,r])=>`<div class="distribution-item"><div class="distribution-title"><span class="distribution-label"><i style="background:${r.color}"></i>${r.label}</span><b>${count(k)} <small>项</small></b></div><div class="distribution-track"><div style="width:${total?count(k)/total*100:0}%;background:${r.color}"></div></div></div>`).join('')}</div><div class="side-caption">统计随专利数据自动更新</div></div><div class="side-panel updates-panel"><div class="side-header"><div class="side-icon sage">${icons.clock}</div><div><h3>最近更新</h3><p>追踪最新进展</p></div></div><div class="recent-list">${recent.map(p=>`<button class="recent-item" onclick="openDetail('${p.id}')"><span class="recent-dot ${p.workflow}"></span><span><strong>${esc(p.title)}</strong><small>${esc(stage(p))} · ${time(p.updated_at)}</small></span>›</button>`).join('')}</div></div><div class="side-quote"><span class="quote-icon">✳</span><p>让每一项研究成果，<br>都拥有清晰的成长轨迹。</p><small>RESEARCH, IN PROGRESS.</small></div></aside></section>
<section class="container why-section" id="about"><div><span class="section-kicker">BUILT FOR RESEARCH TEAMS</span><h2>少一些繁琐，<br><span>多一些专注。</span></h2></div><div class="why-grid"><div><div class="why-icon">↗</div><h3>实时掌握</h3><p>打开网页，查看所有专利当前状态。无需反复询问进度。</p></div><div><div class="why-icon">✎</div><h3>轻松更新</h3><p>管理员在线调整申报阶段，最新进展自动保存。</p></div><div><div class="why-icon">✓</div><h3>清晰可靠</h3><p>三种专利流程、完整阶段记录，公开可看，编辑受控。</p></div></div></section></main><footer class="site-footer"><div class="container footer-inner"><div class="footer-brand">${icons.layers} PatentFlow<span>·</span></div><p>专注科研 · 让进展清晰可见</p><span>© 2026 PatentFlow</span></div></footer></div><div id="modal"></div>`;
 if(dialog==='detail')showDetail();if(dialog==='edit')showEdit(); }
function setFilter(x){filter=x;render()}function setQuery(v){query=v;render();let el=document.getElementById('search');if(el){el.focus();el.setSelectionRange(v.length,v.length)}}
function openDetail(id){selected=patents.find(x=>x.id===id);dialog='detail';showDetail()}
function showDetail(){if(!selected)return;let p=selected;let stages=routes[p.workflow].stages;document.getElementById('modal').innerHTML=`<div class="sheet-overlay" onclick="if(event.target===this)closeDialog()"><aside class="detail-sheet"><div class="sheet-top"><span class="sheet-identifier">${icons.layers} 专利详情</span><button class="icon-button" onclick="closeDialog()">${icons.close}</button></div><div class="sheet-main">${badge(p)}<h2>${esc(p.title)}</h2><div class="sheet-status"><span class="status-indicator"></span>${esc(stage(p))}</div><div class="sheet-meta"><div><span>负责人</span><strong>${esc(p.owner||'未指定')}</strong></div><div><span>最近更新</span><strong>${new Date(p.updated_at).toLocaleDateString('zh-CN')}</strong></div></div><div class="sheet-note"><span class="mini-label">最新进展</span><p>${esc(p.note||'暂无进展备注')}</p></div><div class="section-title small"><h3>申报流程</h3><span>${p.stage+1} / ${stages.length}</span></div><div class="stage-timeline">${stages.map((s,i)=>`<div class="timeline-step ${i<=p.stage?'reached':''} ${i===p.stage?'active':''}"><div class="timeline-mark">${i<p.stage?icons.check:'<span></span>'}</div><div class="timeline-body"><strong>${esc(s)}</strong>${i===p.stage?`<small>${done(p)?'已完成':'当前阶段'}</small>`:''}</div></div>`).join('')}</div><div class="section-title small"><h3>更新记录</h3></div><p class="muted">离线预览仅展示当前进度；云端正式版会自动保存完整更新历史。</p></div><div class="sheet-footer"><button class="btn-primary full" onclick="openEdit('${p.id}')">✎ 修改这项专利</button></div></aside></div>`}
function openEdit(id){editId=id||null;dialog='edit';showEdit()}
function showEdit(){let p=patents.find(x=>x.id===editId)||{title:'',workflow:'pre',stage:0,owner:'',note:''};document.getElementById('modal').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeDialog()"><form class="dialog edit-dialog" onsubmit="return saveForm(event)"><div class="dialog-header"><div><div class="eyebrow">PATENT RECORD</div><h2>${editId?'编辑专利信息':'添加新专利'}</h2></div><button type="button" class="icon-button" onclick="closeDialog()">${icons.close}</button></div><div class="edit-fields"><label class="form-field"><span>专利名称 *</span><input name="title" required maxlength="160" value="${esc(p.title)}" placeholder="请输入完整专利名称"></label><div class="form-two"><label class="form-field"><span>申报流程</span><select name="workflow" onchange="updateStages(this.value)">${Object.entries(routes).map(([k,v])=>`<option value="${k}" ${p.workflow===k?'selected':''}>${v.label}</option>`).join('')}</select></label><label class="form-field"><span>当前阶段</span><select name="stage" id="stage-select"></select></label></div><label class="form-field"><span>负责人</span><input name="owner" maxlength="60" value="${esc(p.owner)}" placeholder="例如：张同学"></label><label class="form-field"><span>最新进展备注</span><textarea rows="4" maxlength="1000" name="note" placeholder="简要记录当前推进情况">${esc(p.note)}</textarea></label></div><div class="dialog-actions"><button type="button" class="btn-quiet" onclick="closeDialog()">取消</button><button type="submit" class="btn-primary">保存更改 →</button></div></form></div>`;updateStages(p.workflow,p.stage)}
function updateStages(key,chosen=0){let el=document.getElementById('stage-select');if(el)el.innerHTML=routes[key].stages.map((s,i)=>`<option value="${i}" ${i===chosen?'selected':''}>${i+1}. ${esc(s)}</option>`).join('')}
function saveForm(e){e.preventDefault();let fd=new FormData(e.target);let obj={title:fd.get('title').trim(),workflow:fd.get('workflow'),stage:Number(fd.get('stage')),owner:fd.get('owner').trim(),note:fd.get('note').trim()};let old=patents.find(p=>p.id===editId);let p={...obj,id:editId||'demo-'+Date.now(),created_at:old?.created_at||new Date().toISOString(),updated_at:new Date().toISOString()};patents=editId?patents.map(x=>x.id===editId?p:x):[p,...patents];persist();dialog='';render();return false}
function closeDialog(){dialog='';document.getElementById('modal').innerHTML=''}
function resetDemo(){if(confirm('要清除浏览器中的演示修改，恢复示例数据吗？')){localStorage.removeItem(key);patents=seed;filter='all';query='';render()}}
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeDialog()});render();
</script><script>
/* PatentFlow cloud mode: Cloudflare D1 + administrator authentication */
let pfAdmin=false, pfAlert="正在连接云端数据库…";
function pfEsc(s){return esc(String(s==null?'':s))}
function pfDecorate(){
 const adminBox=document.querySelector('.admin-actions');
 if(adminBox)adminBox.innerHTML=pfAdmin
   ? '<span class="admin-on">✓ 已登录管理员</span><button class="btn-header" onclick="pfLogout()">退出登录</button>'
   : '<button class="btn-header" onclick="pfLoginDialog()">管理员登录</button>';
 const live=document.querySelector('.live-label');
 if(live)live.innerHTML='<span></span> 云端同步';
 const updated=document.querySelector('.section-updated');
 if(updated)updated.textContent='每 30 秒自动同步';
 const demo=document.querySelector('.demo-banner');
 if(demo){demo.style.display=pfAlert?'block':'none'; demo.innerHTML=pfEsc(pfAlert)}
 const add=document.querySelector('.add-button');
 if(add)add.style.display=pfAdmin?'inline-flex':'none';
 const foot=document.querySelector('.subtle-footer');
 if(foot&&foot.firstElementChild)foot.firstElementChild.textContent='每 30 秒自动同步最新进度';
}
const pfBaseRender=render;
render=function(){pfBaseRender();pfDecorate()};
const pfBaseShowDetail=showDetail;
showDetail=function(){
 pfBaseShowDetail();
 const action=document.querySelector('.sheet-footer .btn-primary');
 if(action)action.style.display=pfAdmin?'block':'none';
 const empty=document.querySelector('.sheet-main .muted');
 if(empty)empty.innerHTML='正在加载历史更新记录…';
 if(selected&&selected.id)pfLoadHistory(selected.id);
};
const pfBaseOpenEdit=openEdit;
openEdit=function(id){if(!pfAdmin){pfLoginDialog();return}pfBaseOpenEdit(id)};
function pfLoginDialog(){
 dialog='login';
 document.getElementById('modal').innerHTML=
 '<div class="overlay" onclick="if(event.target===this)closeDialog()"><form class="dialog edit-dialog" onsubmit="return pfLogin(event)">'+
 '<div class="dialog-header"><div><div class="eyebrow">ADMIN ACCESS</div><h2>管理员登录</h2></div><button type="button" class="icon-button" onclick="closeDialog()">×</button></div>'+
 '<div class="edit-fields"><label class="form-field"><span>管理员密码</span><input name="password" type="password" autocomplete="current-password" required placeholder="请输入管理员密码"></label></div>'+
 '<div class="dialog-actions"><button class="btn-quiet" type="button" onclick="closeDialog()">取消</button><button class="btn-primary" type="submit">登录 →</button></div></form></div>';
}
async function pfFetch(path,options){
 const response=await fetch(path,Object.assign({credentials:'same-origin',cache:'no-store'},options||{}));
 let data={};try{data=await response.json()}catch{}
 if(!response.ok)throw new Error(data.error||'服务器暂时不可用（HTTP '+response.status+'）');
 return data;
}
function pfLogin(event){
 event.preventDefault();
 const password=new FormData(event.target).get('password');
 (async()=>{try{
  await pfFetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})});
  pfAdmin=true;dialog='';render();await pfRefresh();
 }catch(e){alert('登录失败：'+e.message)}})();
 return false;
}
async function pfLogout(){
 try{await pfFetch('/api/auth/logout',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'})}catch(e){console.warn(e)}
 pfAdmin=false;dialog='';render();
}
function saveForm(event){
 event.preventDefault();
 const form=event.target;
 const fd=new FormData(form);
 const body={title:String(fd.get('title')||'').trim(),workflow:String(fd.get('workflow')||''),stage:Number(fd.get('stage')),owner:String(fd.get('owner')||'').trim(),note:String(fd.get('note')||'').trim()};
 const method=editId?'PATCH':'POST';
 const path=editId?'/api/patents/'+encodeURIComponent(editId):'/api/patents';
 (async()=>{try{
  await pfFetch(path,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  dialog='';selected=null;editId=null;await pfRefresh();
 }catch(e){alert('保存失败：'+e.message)}})();
 return false;
}
async function pfRefresh(){
 try{
  const data=await pfFetch('/api/patents');
  if(!Array.isArray(data.patents))throw new Error('服务器响应格式不正确');
  patents=data.patents;pfAlert='';if(dialog!=='edit'&&dialog!=='login')render();
 }catch(e){
  pfAlert='云端数据尚未就绪：'+e.message;
  pfDecorate();
 }
}
async function pfLoadHistory(id){
 try{
  const data=await pfFetch('/api/patents/'+encodeURIComponent(id));
  if(!selected||selected.id!==id||dialog!=='detail')return;
  const history=Array.isArray(data.history)?data.history:[];
  const slot=document.querySelector('.sheet-main .muted');
  if(!slot)return;
  slot.innerHTML=history.length?history.map(item=>{
   const oldName=item.previous_workflow&&routes[item.previous_workflow]?routes[item.previous_workflow].stages[item.previous_stage]:'新增专利';
   const nextName=routes[item.next_workflow]&&routes[item.next_workflow].stages[item.next_stage]||'更新';
   const eventName=oldName===nextName?'信息更新':oldName+' → '+nextName;
   const date=new Date(item.changed_at).toLocaleString('zh-CN');
   return '<div style="padding:12px 0;border-bottom:1px solid #eef0f3"><strong style="font-size:13px">'+pfEsc(eventName)+'</strong><small style="display:block;color:#8b95a8;margin:4px 0">'+pfEsc(date)+'</small><span style="font-size:13px;line-height:1.65">'+pfEsc(item.note||'状态已更新')+'</span></div>';
  }).join(''):'暂无变更记录';
 }catch(e){const slot=document.querySelector('.sheet-main .muted');if(slot)slot.textContent='暂时无法读取历史记录：'+e.message}
}
function resetDemo(){}
async function pfInit(){
 try{const s=await pfFetch('/api/auth/session');pfAdmin=!!s.authenticated}catch{pfAdmin=false}
 render();await pfRefresh();
}
pfAlert='正在加载云端专利数据…';
render();pfInit();
setInterval(()=>{if(document.visibilityState==='visible')pfRefresh()},30000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')pfRefresh()});
</script></body></html>
