.wrap{width:min(1280px,calc(100% - 64px));margin:auto}.topbar{height:72px;background:rgba(255,255,255,.84);backdrop-filter:blur(20px);border-bottom:1px solid rgba(190,199,213,.38);position:sticky;top:0;z-index:30}.topinner{display:flex;align-items:center;justify-content:space-between;height:100%;gap:20px}.brand{font-weight:780;font-size:23px;letter-spacing:-.9px;display:flex;align-items:center;gap:10px}.brandicon{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:#fff;background:linear-gradient(140deg,#387bff,#0749bd);font-size:21px}.navmeta{display:flex;align-items:center;gap:16px}.sync{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:13px}.syncdot{height:7px;width:7px;background:#28a877;border-radius:50%;box-shadow:0 0 0 4px #e6f6ed}.outline{background:#fff;border:1px solid #dfe4ec;color:#27364b;border-radius:11px;padding:11px 16px;font-weight:650;transition:all .2s}.outline:hover{border-color:#abc8f4;background:#f4f8ff}.primary{border:0;background:linear-gradient(125deg,#2475f1,#0c5ada);color:#fff;border-radius:12px;padding:12px 19px;font-weight:650;box-shadow:0 8px 18px rgba(32,103,215,.17);transition:filter .2s,transform .2s}.primary:hover{filter:brightness(1.07)}.secondary{background:#f1f4fa;border:0;color:#334760;padding:11px 16px;border-radius:11px;font-weight:650}.small{font-size:13px;padding:8px 12px}.main{padding:42px 0 80px}.eyebrow{font-size:12px;color:#3772d5;font-weight:750;letter-spacing:2.3px;text-transform:uppercase}.headline{margin:12px 0 12px;font-size:clamp(31px,4vw,52px);letter-spacing:-2px;line-height:1.14}.headline span{color:#2472e7}.hero{display:flex;justify-content:space-between;align-items:center;gap:25px;margin-bottom:29px}.sub{font-size:16px;line-height:1.65;color:var(--muted);margin:0}.hero-right{display:flex;align-items:center;gap:12px}.caption{color:var(--muted);font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:27px}.stat{background:#fff;bord  .25s,box-shadow .25s,border .25s;animation:rise .34s both}.patent:hover{transform:translateY(-4px);box-shadow:0 14px 35px rgba(27,51,91,.08);border-color:#bed4f9}.cardhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.pill{border-radius:999px;font-size:12px;font-weight:730;padding:7px 11px;background:#edf4ff;color:#2769d5;white-space:nowrap}.pill.utility{background:#eaf8f4;color:#16856a}.pill.software{background:#f3efff;color:#7b55c0}.pill.priority{background:#fff3e6;color:#bd7424}.update{color:#929cac;font-size:12px;white-space:nowrap}.patent h3{font-size:19px;line-height:1.45;letter-spacing:-.35px;min-height:52px;margin:0 0 15px;word-break:break-word}.card-details{display:flex;gap:18px;flex-wrap:wrap;color:#637186;font-size:13px;margin-bottom:17px}.card-details strong{font-weight:650;color:#293b53}.progressrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.stage-name{font-weight:680;color:#274565;font-size:14px}.progress-count{font-size:12px;color:#8491a3;white-space:nowrap}.track{height:7px;background:#edf1f5;border-radius:30px;overflow:hidden}.track>div{height:100%;border-radius:30px;background:linear-gradient(90deg,#478ff6,#1863e5);transition:width .35s}.card-foot{margin-top:14px;font-size:13px;color:#647388;display:flex;gap:5px;align-items:center}.card-foot b{color:#293a53}.empty{grid-column:1/-1;padding:72px 20px;text-align:center;background:#fff;border:1px dashed #d9e0eb;border-radius:22px;color:#8190a3}.empty strong{display:block;font-size:19px;color:#3c4b60;margin:10px 0}.empty p{margin:0}.empty .icon{font-size:37px}.refreshnote{margin-top:17px;color:#91a0ad;font-size:12px}.footer{border-top:1px solid var(--line);margin-top:56px;padding:24px 0;color:#94a0ad;font-size:13px}.footerinner{display:flex;justify-content:space-between;gap:15px}
.overlay{position:fixed;inset:0;z-index:55;background:rgba(21,34,54,.43);backdrop-filter:blur(7px);display:flex;align-items:center;justify-content:center;padding:25px;animation:fade .2s}.modal{width:min(760px,100%);max-height:min(91vh,1000px);background:#fff;border-radius:24px;box-shadow:0 25px 100px #091c3950;overflow:hidden;display:flex;flex-direction:column;animation:pop .23s}.modal.narrow{width:min(425px,100%)}.modal-head{display:flex;align-items:start;justify-content:space-between;border-bottom:1px solid var(--line);padding:24px 27px 19px;gap:12px}.modal-kicker{font-size:12px;font-weight:700;color:#286ee1;letter-spacing:1.2px;margin:0 0 7px}.modal h2{margin:0;font-size:24px;line-height:1.35;letter-spacing:-.6px;word-break:break-word}.close{font-size:23px;background:#f2f4f7;border:0;border-radius:10px;width:35px;height:35px;flex-shrink:0}.modal-body{overflow:auto;padding:23px 27px 27px;overscroll-behavior:contain}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}.field{display:block;min-width:0}.field.full{grid-column:1/-1}.field label{display:block;font-size:13px;font-weight:710;margin:0 0 7px;color:#47576c}.field input,.field select,.field textarea{border:1px solid #dbe2ec;border-radius:11px;background:#fff;width:100%;padding:12px 13px;font-size:15px;color:#26354b;min-height:47px}.field textarea{min-height:90px;resize:vertical;line-height:1.5}.hint{font-size:12px;color:#8b96a7;margin-top:7px;line-height:1.55}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.sep{height:1px;background:#ecf0f4;margin:25px 0}.small-heading{font-size:17px;margin:0 0 7px}.phases{margin:16px 0 8px;display:grid;gap:9px}.phase{display:flex;gap:12px;align-items:center;border:1px solid #e9edf4;border-radius:13px;padding:12px 13px;transition:background .2s}.phase.active{background:#eff6ff;border-color:#c4dbff}.phase.completed .phase-num{background:#e5f6ed;color:#138d5d}.phase-num{flex-shrink:0;width:31px;height:31px;display:grid;place-items:center;background:#eef1f5;color:#698096;border-radius:10px;font-size:13px;font-weight:750}.phase-main{flex:1;min-width:0}.phase-name{font-size:14px;font-weight:710;line-height:1.45}.phase-owner{font-size:12px;color:#8190a2;margin-top:4px}.phase .check{font-size:12px;color:#2878dc}.phase select{max-width:200px;min-width:90px;border:1px solid #dce4ef;background:#fff;border-radius:10px;padding:10px;font-size:13px}.detail-meta{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}.infochips{background:#f6f8fb;border-radius:14px;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:14px}.infochips span{font-size:12px;color:#8993a1;display:block;margin-bottom:5px}.infochips strong{font-size:14px;font-weight:650;word-break:break-word}.history{border-left:2px solid #e5edf8;margin:14px 0 0 6px;padding-left:19px}.history-item{position:relative;margin:0 0 21px}.history-item:before{position:absolute;content:'';left:-26px;top:3px;background:#5b97f3;border:3px solid #eef5ff;width:8px;height:8px;border-radius:50%}.history-item b{font-size:14px}.history-item small{color:#8795a7;display:block;margin-top:4px}.notice{padding:12px 15px;background:#fff8e9;color:#936623;border-radius:12px;font-size:13px;line-height:1.6}.successnotice{background:#eef9f2;color:#287653}.ownerlist{display:grid;gap:9px;margin-top:13px}.ownerrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(120px,190px);gap:10px;align-items:center}.ownerrow label{font-size:13px;color:#42536a}.ownerrow input{width:100%;min-width:0;border:1px solid #dce3ed;border-radius:10px;padding:10px;font-size:13px}.flowtoggle{display:flex;gap:8px;align-items:center;margin:13px 0}.flowtoggle button{border:1px solid #dce4ef;color:#4a5d73;border-radius:11px;background:white;padding:11px 14px;flex:1;font-weight:680}.flowtoggle button.active{border-color:#9ec6fd;background:#edf5ff;color:#1f6ae3}.section-caption{font-size:13px;color:#8692a1}.loading{opacity:.65;pointer-events:none}.category-enter{animation:rise .32s ease both}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes pop{from{opacity:0;transform:translateY(13px) scale(.98)}to{opacity:1;transform:none}}@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}

<body>
<header class="topbar"><div class="wrap topinner"><a class="brand" href="/" aria-label="PatentFlow 首页"><span class="brandicon">◈</span> PatentFlow</a><div class="navmeta"><span class="sync"><span class="syncdot"></span> 云端同步</span><button id="adminButton" class="outline" type="button">管理员登录</button></div></div></header>
<main class="main wrap">
 <div class="hero"><div><div class="eyebrow">RESEARCH MANAGEMENT · 2026</div><h1 class="headline">每一项成果，都<span>清晰可见。</span></h1><p class="sub">专利与软件著作权申报进度 · 实时更新 · 公开查看</p></div><div class="hero-right"><span class="caption" id="lastSync">等待同步</span><button id="refreshButton" class="outline" type="button">↻ 刷新</button></div></div>
 <div class="stats" id="stats"></div>
 <section id="records"><div class="section-head"><div><h2 class="section-title">成果进度</h2><div class="section-descr">按成果类型查看项目、负责人及当前办理阶段</div></div><button id="addButton" class="primary" type="button" hidden>＋ 新增成果</button></div>
 <div class="tabs" id="tabs" role="tablist" aria-label="成果类别"></div><div class="controls"><div class="search"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg><input id="searchInput" aria-label="搜索成果" placeholder="搜索名称、发明人、负责人或代理机构"></div><span class="mini-info" id="resultCount"></span></div>
 <div class="cards" id="cards" aria-live="polite"></div><div class="refreshnote" id="statusLine"></div></section>
 <div class="footer"><div class="footerinner"><span>© 2026 PatentFlow · 科研成果管理平台</span><span>数据由课题组管理员维护 · 网页每30秒自动同步</span></div></div>
</main>
<div id="modalRoot"></div><datalist id="staffOptions"></datalist>
<script>
'use strict';
const FLOWS={pre:{label:'预审',steps:['撰写中','学校平台预审','预审通过后交专利公司撰写','撰写研发证明材料等相关材料','学校盖章','预审中','下证']},priority:{label:'优先审查',steps:['优先审查中','撰写优先审查相关材料','学校盖章','优审中','下证']},utility:{label:'实用新型',steps:['撰写中','学校平台审查','审查通过后交专利公司撰写','审查中','下证']},software:{label:'软件著作权',steps:['撰写中','审查中','下证']}};
const CATS={invention:'发明专利',utility:'实用新型专利',software:'计算机软件著作权'};
const AGENCIES=['安徽阜梦','北京荟英'];
const state={records:[],staff:[],admin:false,tab:'all',query:'',dialog:null,current:null,draft:null,history:[],error:'',loading:true};
const $=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>d?new Date(d).toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit'}):'—';
const catOf=p=>p.category||((p.workflow==='utility')?'utility':'invention');
const flowOf=p=>catOf(p)==='software'?'software':p.workflow;
const stageOf=p=>FLOWS[flowOf(p)]?.steps[p.stage]||'待确认';
const stageKey=(f,i)=>f+':'+i;
const resolveOwner=p=>p.owners?.[stageKey(flowOf(p),p.stage)]||p.owner||'待指定';
function card(p,i){const cat=catOf(p),flow=flowOf(p),max=FLOWS[flow]?.steps.length||1,percent=(p.stage+1)/max*100;return `<article class="patent" tabindex="0" role="button" data-id="${esc(p.id)}" style="animation-delay:${Math.min(i*45,330)}ms" aria-label="查看${esc(p.title)}详情"><div class="cardhead"><span class="pill ${cat==='utility'?'utility':cat==='software'?'software':flow==='priority'?'priority':''}">${esc(CATS[cat]||'发明专利')}${flow==='priority'?' · 优审':''}</span><span class="update">更新 ${fmt(p.updated_at)}</span></div><h3>${esc(p.title)}</h3><div class="card-details"><span>当前负责人：<strong>${esc(resolveOwner(p))}</strong></span>${cat!=='software'?`<span>代理：<strong>${esc(p.agency||'未指定')}</strong></span>`:''}</div><div class="progressrow"><span class="stage-name">${esc(stageOf(p))}</span><span class="progress-count">${p.stage+1} / ${max} 阶段</span></div><div class="track"><div style="width:${percent}%"></div></div><div class="card-foot">${p.note?`进展：<b>${esc(p.note.length>50?p.note.slice(0,50)+'…':p.note)}</b>`:'点击查看详细进度与节点负责人'} <span style="margin-left:auto;color:#387de7">↗</span></div></article>`}
function render(){const total=state.records.length;const count=c=>state.records.filter(p=>catOf(p)===c).length;const done=state.records.filter(p=>{let f=flowOf(p);return p.stage===FLOWS[f]?.steps.length-1}).length;const vals=[['成果总数',total,'◈','全部登记成果'],['发明专利',count('invention'),'◇','含预审及优审'],['实用新型',count('utility'),'▣','实用新型申请'],['软件著作权',count('software'),'⌘',done+' 项成果已下证']];$('#stats').innerHTML=vals.map(([k,v,ic,sub])=>`<div class="stat"><div class="statline">${k}<span class="stat-icon">${ic}</span></div><strong>${v}</strong><small>${sub}</small></div>`).join('');
 const tabs=[['all','全部成果'],...Object.entries(CATS)];$('#tabs').innerHTML=tabs.map(([v,label])=>`<button class="tab ${state.tab===v?'active':''}" role="tab" aria-selected="${state.tab===v}" data-tab="${v}">${label}<b>${v==='all'?total:count(v)}</b></button>`).join('');
 const q=state.query.trim().toLocaleLowerCase(),filtered=state.records.filter(p=>(state.tab==='all'||catOf(p)===state.tab)&&(!q||[p.title,p.inventors,p.agency,p.owner,p.note,...Object.values(p.owners||{})].join(' ').toLocaleLowerCase().includes(q)));
 $('#cards').innerHTML=filtered.length?filtered.map(card).join(''):`<div class="empty"><div class="icon">◇</div><strong>${state.loading?'正在同步成果记录…':state.error?'暂时无法获取数据':q?'没有找到符合条件的成果':'这里还没有成果记录'}</strong><p>${esc(state.error||(!state.loading&&!q?'管理员登录后可以新增第一项成果。':'请尝试调整搜索内容。'))}</p></div>`;
 $('#resultCount').textContent='显示 '+filtered.length+' 项成果';$('#adminButton').textContent=state.admin?'退出管理':'管理员登录';$('#addButton').hidden=!state.admin;$('#lastSync').textContent='上次同步 '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});$('#statusLine').textContent=state.error?'同步提示：'+state.error:'最近更新的成果排列在前。';}
async function api(path,opts={}){const response=await fetch(path,{credentials:'same-origin',cache:'no-store',...opts});let data;try{data=await response.json()}catch{throw Error('服务器返回了非 JSON 响应（HTTP '+response.status+'）')}if(!response.ok)throw Error(data.error||'操作失败（HTTP '+response.status+'）');return data}
async function sync(){try{const data=await api('/api/patents');state.records=data.patents||[];state.error='';}catch(e){state.error=e.message}state.loading=false;render()}
async function getStaff(){try{const d=await api('/api/staff');state.staff=d.staff||[];$('#staffOptions').innerHTML=state.staff.map(s=>`<option value="${esc(s)}"></option>`).join('')}catch(e){console.warn(e)}}
function openModal(html,small=false){$('#modalRoot').innerHTML=`<div class="overlay" id="overlay"><div class="modal ${small?'narrow':''}" role="dialog" aria-modal="true">${html}</div></div>`;$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal()});document.addEventListener('keydown',escClose,{once:true})}
function escClose(e){if(e.key==='Escape')closeModal()}
function closeModal(){state.dialog=null;state.current=null;$('#modalRoot').innerHTML=''}
function loginView(){openModal(`<div class="modal-head"><div><div class="modal-kicker">SECURE ACCESS</div><h2>管理员登录</h2></div><button class="close" data-close>×</button></div><form id="loginForm" class="modal-body"><p class="section-caption" style="margin-top:0">老师和成员查看进度无需登录。仅更新专利状态时使用管理员身份。</p><div class="field"><label for="pass">管理员密码</label><input id="pass" name="password" type="password" autocomplete="current-password" required placeholder="输入管理员密码"></div><div class="modal-actions"><button type="button" class="secondary" data-close>取消</button><button type="submit" class="primary">安全登录</button></div></form>`,true);$('#pass').focus()}
const emptyDraft=(cat='invention')=>({id:null,title:'',category:cat,workflow:cat==='invention'?'pre':cat==='software'?'software':'utility',stage:0,owner:'',owners:{},agency:cat==='software'?'':AGENCIES[0],inventors:'',note:'',version:0});
function ownerVal(p,f,i){return p.owners?.[stageKey(f,i)]||(f===flowOf(p)&&i===p.stage?p.owner:'')||''}
function ownerInputs(p){const flow=p.workflow;return `<div class="ownerlist">${FLOWS[flow].steps.map((label,i)=>`<div class="ownerrow"><label for="own${i}"><b style="color:#6793d7">${String(i+1).padStart(2,'0')}</b>　${esc(label)}</label><input id="own${i}" data-owner="${stageKey(flow,i)}" list="modalStaffOptions" value="${esc(ownerVal(p,flow,i))}" placeholder="选择或输入姓名" maxlength="60" autocomplete="off"></div>`).join('')}</div><datalist id="modalStaffOptions">${state.staff.map(s=>`<option value="${esc(s)}"></option>`).join('')}</datalist>`}
function editView(p){state.draft={...p,owners:{...(p.owners||{})}};const d=state.draft;const categoryOptions=Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${k===d.category?'selected':''}>${v}</option>`).join('');openModal(`<div class="modal-head"><div><div class="modal-kicker">${p.id?'EDIT RECORD':'NEW RECORD'}</div><h2>${p.id?'编辑成果进度':'新增成果记录'}</h2></div><button class="close" data-close>×</button></div><form class="modal-body" id="editForm"><div class="form-grid"><div class="field full"><label for="titleInput">成果名称 *</label><input id="titleInput" name="title" maxlength="180" required value="${esc(d.title)}" placeholder="请输入完整成果名称"></div><div class="field"><label for="categoryInput">成果类型 *</label><select id="categoryInput" name="category">${categoryOptions}</select></div><div class="field" id="agencySlot"></div><div class="field full"><label id="inventorLabel" for="inventorsInput">发明人</label><input name="inventors" id="inventorsInput" maxlength="500" value="${esc(d.inventors)}" placeholder="多人可用顿号隔开"></div><div class="field full" id="flowSlot"></div><div class="field full" id="stageSlot"></div><div class="field full" id="ownerSlot"></div><div class="field full"><label for="noteInput">当前进展说明</label><textarea name="note" id="noteInput" maxlength="1200" placeholder="例如：已提交学校平台，等待预审结果">${esc(d.note)}</textarea></div></div><div class="modal-actions"><button type="button" class="secondary" data-close>取消</button><button type="submit" class="primary">保存到云端</button></div></form>`);drawEditFields()}
function drawEditFields(){const d=state.draft;if(!d)return;$('#inventorLabel').textContent=d.category==='software'?'著作权人 / 开发人员':'发明人';$('#agencySlot').innerHTML=d.category==='software'?`<label>代理机构</label><input disabled value="不适用"><div class="hint">软件著作权暂不要求指定专利代理机构。</div>`:`<label for="agencyInput">专利代理机构 *</label><select id="agencyInput" name="agency">${AGENCIES.map(a=>`<option ${a===d.agency?'selected':''}>${esc(a)}</option>`).join('')}</select>`;
 let canPriority=d.category==='invention'&&d.id&&d.workflow==='pre';$('#flowSlot').innerHTML=d.category==='invention'?`<label>申报路线</label><div class="flowtoggle"><button type="button" data-flow="pre" ${d.workflow==='priority'?'disabled':''} class="${d.workflow==='pre'?'active':''}">预审流程</button><button type="button" data-flow="priority" class="${d.workflow==='priority'?'active':''}" ${!canPriority&&d.workflow!=='priority'?'disabled':''}>预审未通过 → 转优审</button></div><div class="hint">发明专利均从预审开始；预审不通过后，明确选择“转优审”，系统保留原预审记录。</div>`:'<label>申报流程</label><div class="hint">已根据成果类型自动匹配流程，不需要手动选择。</div>';
 $('#stageSlot').innerHTML=`<label for="stageInput">当前办理阶段 *</label><select id="stageInput" name="stage">${FLOWS[d.workflow].steps.map((s,i)=>`<option value="${i}" ${i===d.stage?'selected':''}>${i+1}. ${esc(s)}</option>`).join('')}</select><div class="hint">负责人按每个节点分别维护；切换当前阶段时会使用对应节点的负责人。</div>`;
 $('#ownerSlot').innerHTML=`<label>各阶段负责人</label><div class="hint">点击任一输入框，可从已有人员中选择，也可以输入新姓名；保存后加入人员选项。</div>${ownerInputs(d)}`;
}
function harvestOwners(){if(!state.draft)return;document.querySelectorAll('[data-owner]').forEach(i=>{state.draft.owners[i.dataset.owner]=i.value.trim()})}
async function saveEdit(e){e.preventDefault();const d=state.draft;if(!d)return;harvestOwners();const form=e.currentTarget;const fd=new FormData(form);const body={title:String(fd.get('title')||'').trim(),category:d.category,workflow:d.workflow,stage:Number(fd.get('stage')),agency:d.category==='software'?'':String(fd.get('agency')||''),inventors:String(fd.get('inventors')||'').trim(),note:String(fd.get('note')||'').trim(),owners:d.owners,owner:d.owners[stageKey(d.workflow,Number(fd.get('stage')))]||'',version:d.version};const save=form.querySelector('[type="submit"]');save.disabled=true;save.textContent='保存中…';try{await api(d.id?'/api/patents/'+encodeURIComponent(d.id):'/api/patents',{method:d.id?'PATCH':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});closeModal();await Promise.all([sync(),getStaff()])}catch(err){alert('保存失败：'+err.message);save.disabled=false;save.textContent='保存到云端'}}
function detailView(p){state.current=p;const cat=catOf(p),flow=flowOf(p);openModal(`<div class="modal-head"><div><div class="modal-kicker">${esc(CATS[cat])}${flow==='priority'?' · 优先审查':''}</div><h2>${esc(p.title)}</h2></div><button class="close" data-close>×</button></div><div class="modal-body"><div class="detail-meta"><span class="pill ${cat==='utility'?'utility':cat==='software'?'software':flow==='priority'?'priority':''}">${esc(FLOWS[flow].label)}</span><span class="pill">当前：${esc(stageOf(p))}</span></div><div class="infochips"><div><span>当前负责人</span><strong>${esc(resolveOwner(p))}</strong></div><div><span>最后更新</span><strong>${esc(fmt(p.updated_at))}</strong></div><div><span>${cat==='software'?'著作权人 / 开发人员':'发明人'}</span><strong>${esc(p.inventors||'尚未填写')}</strong></div><div><span>专利代理机构</span><strong>${esc(cat==='software'?'不适用':p.agency||'尚未指定')}</strong></div></div><div class="sep"></div><h3 class="small-heading">办理进度 · 节点负责人</h3><p class="section-caption" style="margin-top:0">绿色为已完成，蓝色为当前阶段，灰色为待推进。</p><div class="phases">${FLOWS[flow].steps.map((label,i)=>`<div class="phase ${i===p.stage?'active':i<p.stage?'completed':''}"><div class="phase-num">${i<p.stage?'✓':i+1}</div><div class="phase-main"><div class="phase-name">${esc(label)}</div><div class="phase-owner">负责人：${esc(ownerVal(p,flow,i)||'待指定')}</div></div><span class="check">${i===p.stage?'进行中':i<p.stage?'已完成':'待开始'}</span></div>`).join('')}</div>${cat==='invention'&&flow==='priority'?'<div class="notice successnotice">本成果已由预审路线转入优先审查。原预审节点记录仍保存在历史日志中。</div>':''}<div class="sep"></div><h3 class="small-heading">最新进展</h3><p style="color:#546378;line-height:1.7;font-size:14px">${esc(p.note||'尚未填写进展备注')}</p><div class="sep"></div><h3 class="small-heading">变更历史</h3><div id="historyContent" class="history"><p class="section-caption">正在读取历史…</p></div>${state.admin?'<div class="modal-actions"><button type="button" id="editFromDetail" class="primary">编辑成果及负责人</button></div>':''}</div>`);loadHistory(p.id)}
async function loadHistory(id){try{const d=await api('/api/patents/'+encodeURIComponent(id));const target=$('#historyContent');if(!target)return;target.innerHTML=(d.history||[]).length?d.history.map(h=>`<div class="history-item"><b>${esc(h.previous_workflow&&h.previous_workflow!==h.next_workflow?'申报流程变更 · ':'' )}${esc(FLOWS[h.next_workflow]?.steps[h.next_stage]||'信息更新')}</b><small>${esc(new Date(h.changed_at).toLocaleString('zh-CN'))}</small><div class="section-caption" style="margin-top:6px;line-height:1.55">${esc(h.note||'阶段信息已更新')}</div></div>`).join(''):'<p class="section-caption">暂无历史记录</p>'}catch(e){const el=$('#historyContent');if(el)el.textContent='历史记录获取失败：'+e.message}}
$('#adminButton').onclick=async()=>{if(state.admin){if(!confirm('退出管理员身份？'))return;try{await api('/api/auth/logout',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'})}catch(e){alert(e.message)}state.admin=false;render()}else loginView()};
$('#addButton').onclick=()=>editView(emptyDraft(state.tab==='all'?'invention':state.tab));$('#refreshButton').onclick=sync;
$('#searchInput').addEventListener('input',e=>{state.query=e.target.value;render()});$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b){state.tab=b.dataset.tab;render()}});
$('#cards').addEventListener('click',e=>{const card=e.target.closest('[data-id]');if(card){const p=state.records.find(x=>x.id===card.dataset.id);if(p)detailView(p)}});$('#cards').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const c=e.target.closest('[data-id]');if(c){e.preventDefault();c.click()}}});
$('#modalRoot').addEventListener('click',e=>{if(e.target.closest('[data-close]'))closeModal();const x=e.target.closest('[data-flow]');if(x&&state.draft){harvestOwners();const next=x.dataset.flow;if(next==='priority'&&state.draft.workflow==='pre'){if(!confirm('确认预审未通过，转入优先审查？原预审历史会保留。'))return;state.draft.workflow='priority';state.draft.stage=0;drawEditFields()}else if(next==='pre'&&state.draft.workflow!=='pre'){state.draft.workflow='pre';state.draft.stage=0;drawEditFields()}}const edit=e.target.closest('#editFromDetail');if(edit){const p=state.current;editView(p)}});
$('#modalRoot').addEventListener('change',e=>{if(!state.draft)return;if(e.target.id==='categoryInput'){harvestOwners();state.draft.category=e.target.value;state.draft.workflow=e.target.value==='software'?'software':e.target.value==='utility'?'utility':'pre';state.draft.stage=0;state.draft.agency=AGENCIES[0];drawEditFields()}else if(e.target.id==='stageInput'){harvestOwners();state.draft.stage=Number(e.target.value)}});
$('#modalRoot').addEventListener('submit',async e=>{if(e.target.id==='loginForm'){e.preventDefault();const submit=e.target.querySelector('button[type="submit"]');submit.disabled=true;try{await api('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:e.target.password.value})});state.admin=true;closeModal();render();await getStaff()}catch(x){alert('登录失败：'+x.message);submit.disabled=false}}else if(e.target.id==='editForm')await saveEdit(e)});
(async()=>{try{const s=await api('/api/auth/session');state.admin=!!s.authenticated}catch{}await Promise.all([sync(),getStaff()]);render()})();setInterval(()=>{if(document.visibilityState==='visible')sync()},30000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')sync()});
</script>
</body></html>
